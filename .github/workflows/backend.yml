name: Backend CI

on:
  push:
    branches:
      - main
      - dev
    paths:
      - 'src/backend/**'
      - 'tests/backend/**'
  pull_request:
    branches:
      - main
      - dev
    paths:
      - 'src/backend/**'
      - 'tests/backend/**'

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore src/backend/Aircane.sln

      - name: Build
        run: dotnet build src/backend/Aircane.sln --no-restore -c Release

      - name: Test
        run: >
          dotnet test src/backend/Aircane.sln
          --no-build -c Release
          --logger "trx;LogFileName=test-results.trx"
          --results-directory ./TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: ./TestResults/*.trx
