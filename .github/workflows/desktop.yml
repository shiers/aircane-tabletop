name: Desktop CI

# Builds the Tauri desktop wrapper on all three platforms and uploads the
# installers as artifacts. Release tagging/publishing is a deliberate manual
# step — this workflow never creates a GitHub Release.

on:
  push:
    branches:
      - main
    paths:
      - 'desktop/**'
      - 'src/backend/**'
      - 'src/frontend/**'
      - 'VERSION'
      - '.github/workflows/desktop.yml'
  # Validate the desktop build on PRs that touch the wrapper, backend, or
  # frontend, so the 3-platform Rust/Tauri build is checked before merge (the
  # only place it runs pre-merge, since Rust isn't compiled in local dev).
  # Path-scoped to avoid running these heavy builds on unrelated PRs.
  pull_request:
    paths:
      - 'desktop/**'
      - 'src/backend/**'
      - 'src/frontend/**'
      - 'VERSION'
      - '.github/workflows/desktop.yml'
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            build: pwsh ./build.ps1
          - os: macos-latest
            build: bash ./build.sh
          - os: ubuntu-latest
            build: bash ./build.sh

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Linux needs the WebKitGTK webview + GTK dev headers, plus the packaging
      # tools Tauri uses for AppImage/deb.
      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      # The Tauri CLI is a devDependency of desktop/package.json; install it so
      # the build scripts' `npx tauri build` fallback works even without a global
      # cargo-tauri.
      - name: Install Tauri CLI (npm)
        working-directory: desktop
        run: npm ci

      - name: Build desktop app
        working-directory: desktop
        run: ${{ matrix.build }}

      # ── Bundle-layout smoke test ──────────────────────────────────────────────
      # The Tauri `resources` object/map form has no in-repo precedent, so assert
      # the packaged app actually contains tessdata/eng.traineddata under its
      # resource dir. This fails the matrix build early if the map-form resources
      # layout does not land where sidecar.rs's resource_dir() lookup expects,
      # rather than surfacing as a runtime "OCR unavailable" surprise.
      - name: Assert bundled OCR model (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          # Windows bundles are .msi/.exe installers with resources packed inside,
          # so check the exe dir: on Windows resource_dir() is the exe's dir, and
          # tauri-build stages resources there with the same layout the installers ship.
          $hit = 'desktop/src-tauri/target/release/tessdata/eng.traineddata'
          if (-not (Test-Path $hit -PathType Leaf)) {
            Write-Error "Bundled resource not found at $hit. The map-form resources layout did not land where resource_dir() expects."
            exit 1
          }
          Write-Host "OK: found $hit"

      - name: Assert bundled OCR model (Unix)
        if: matrix.os != 'windows-latest'
        shell: bash
        run: |
          bundle='desktop/src-tauri/target/release/bundle'
          hit="$(find "$bundle" -type f -path '*/tessdata/eng.traineddata' 2>/dev/null | head -n1 || true)"
          if [ -z "$hit" ]; then
            echo "ERROR: bundled resource tessdata/eng.traineddata not found under $bundle. The map-form resources layout did not land where resource_dir() expects." >&2
            exit 1
          fi
          echo "OK: found $hit"

      # ── Upload installers (artifacts only — no auto-publish) ──────────────────
      - name: Upload Windows installers
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: aircane-desktop-windows
          path: |
            desktop/src-tauri/target/release/bundle/msi/*.msi
            desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: warn

      - name: Upload macOS installer
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: aircane-desktop-macos
          path: desktop/src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: warn

      - name: Upload Linux installers
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: aircane-desktop-linux
          path: |
            desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            desktop/src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: warn
