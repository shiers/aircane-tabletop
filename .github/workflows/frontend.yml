name: Frontend CI

on:
  push:
    branches:
      - main
      - dev
    paths:
      - 'src/frontend/**'
      - 'tests/e2e/**'
  pull_request:
    branches:
      - main
      - dev
    # No paths filter on PRs: the job must always report so it can be a required status check
    # (a filtered-out required check would stay pending forever and block the merge).

jobs:
  lint-test-build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: src/frontend/aircane-web

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: src/frontend/aircane-web/package-lock.json

      # Installs exactly what package-lock.json says (and fails if it disagrees with package.json), so lint, the
      # type-check and the build run on the same versions as everyone else.
      - name: Install dependencies
        run: npm ci

      # Required: no continue-on-error. ESLint over the app, the specs, the scripts and the e2e specs
      # (docs/setup/frontend-lint.md).
      - name: Lint
        run: npm run lint

      # Required: no continue-on-error. Covers the app, the vitest specs, vite.config.ts and the e2e specs, and fails if
      # the check ever stops covering them (docs/setup/frontend-typecheck.md).
      - name: Type check
        run: npm run typecheck

      # Runs the type-check again first (about 10 seconds, since the compile is cached), then bundles.
      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-test-results
          path: src/frontend/aircane-web/test-results/**
