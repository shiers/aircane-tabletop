<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Aircane Tabletop</title>
    <style>
      :root {
        color-scheme: dark;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0b1020;
        color: #e5e7eb;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      .wrap {
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.25rem;
      }
      .mark {
        width: 84px;
        height: 84px;
        border-radius: 20px;
        background: linear-gradient(135deg, #4f46e5, #0ea5e9);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 44px;
        font-weight: 700;
        color: #ffffff;
        box-shadow: 0 10px 40px rgba(79, 70, 229, 0.35);
      }
      h1 {
        margin: 0;
        font-size: 1.35rem;
        font-weight: 600;
        letter-spacing: 0.01em;
      }
      p {
        margin: 0;
        color: #9ca3af;
        font-size: 0.95rem;
      }
      .spinner {
        width: 28px;
        height: 28px;
        border: 3px solid rgba(148, 163, 184, 0.3);
        border-top-color: #38bdf8;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="mark">A</div>
      <h1>Aircane Tabletop</h1>
      <div class="spinner" role="status" aria-label="Starting"></div>
      <p>Starting the local server…</p>
    </div>
  </body>
</html>
